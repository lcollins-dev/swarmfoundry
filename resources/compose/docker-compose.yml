# Copy this folder and replace config/ with your own. Fill .env from .env.tpl. See DEPLOYMENT.md.
name: swarmfoundry

services:
  app:
    image: ghcr.io/lcollins-dev/swarmfoundry:${SWARMFOUNDRY_VERSION:?set it in .env}
    hostname: app
    restart: always
    # Loopback only, since agents can reach every port the host publishes.
    ports:
      - 127.0.0.1:${APP_PORT:-8080}:3000
    depends_on:
      db:
        condition: service_healthy
      agent-image:
        condition: service_completed_successfully
    env_file:
      - app.env
      - .env
    environment:
      SWARMFOUNDRY_CONFIG: /etc/swarmfoundry/swarmfoundry.yaml
      SWARMFOUNDRY_VERSION: ${SWARMFOUNDRY_VERSION}
      AGENT_IMAGE: swarmfoundry-agent:${SWARMFOUNDRY_VERSION}
      SANDBOX_NAMESPACE: ${SANDBOX_NAMESPACE:-swarmfoundry}
      USER_TOKEN_SECRET: ${USER_TOKEN_SECRET:?set it in .env}
    group_add:
      - ${DOCKER_GID:?set it in .env to the group id of /var/run/docker.sock}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The socket makes this container root-equivalent on the host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SWARMFOUNDRY_CONFIG_DIR:-./config}:/etc/swarmfoundry:ro
      - config-repo:/var/lib/swarmfoundry/config-repo

  # Builds the agent image, then exits.
  agent-image:
    build:
      context: ./agent
    image: swarmfoundry-agent:${SWARMFOUNDRY_VERSION}
    entrypoint: [claude, --version]
    network_mode: none
    restart: 'no'

  db:
    image: postgres:17.7-alpine
    hostname: db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Over TCP, so the temporary server init-db.sh runs under does not pass.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U postgres']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

volumes:
  pg-data:
  config-repo:
