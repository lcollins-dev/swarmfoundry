# Paths resolve relative to this file. ${VAR} uses the orchestrator's environment or a .env beside this file.

sources:
  gitlab-local:
    type: gitlab
    url: https://gitlab.example.com # replace this host, the project and usernames with your own
    token: ${GITLAB_TOKEN}
    pollInterval: 60s
    projects: [group/project]

agents:
  claude-subscription:
    type: claude
    auth: oauth # oauth | apiKey
    token: ${CLAUDE_CODE_OAUTH_TOKEN}
    model: claude-opus-5-5
    settings: ./agents/claude/settings.json
    instructions: ./agents/claude/instructions.md

  claude-api:
    type: claude
    auth: apiKey
    token: ${ANTHROPIC_API_KEY}
    model: claude-sonnet-5-5
    settings: ./agents/claude/settings.json
    instructions: ./agents/claude/instructions.md

environments:
  node-postgres:
    image: ${AGENT_IMAGE} # built by Compose
    agent: { name: claude-subscription }
    env:
      GITLAB_TOKEN: ${GITLAB_BOT_TOKEN}
      GITLAB_HOST: gitlab.example.com
      MR_REVIEWER: maintainer
    mounts:
      - { source: /srv/swarmfoundry/cache/npm, target: /home/node/.npm, readOnly: false }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: postgres }
    resources: { cpus: 4, memory: 8g }

# x- keys are dropped after parsing. A trigger's own list replaces the anchor's.
x-trigger: &trigger
  source: gitlab-local
  failureSteps:
    - comment: '{{failure.report}}'
    - relabel: { add: [foundry::failed], remove: [foundry::running] }
x-agent: &agent
  environment: node-postgres

triggers:
  implement:
    <<: *trigger
    steps:
      - relabel: { add: [workflow::in-progress, foundry::running], remove: [workflow::ready] }
      - agent:
          <<: *agent
          systemPrompt: ./prompts/implement/system-prompt.md
          prompt: ./prompts/implement/prompt.md
          timeout: 60m
      - relabel: { remove: [foundry::running] }
    concurrency: 1
    issue:
      labels: [workflow::ready]
      notLabels: [foundry::failed, foundry::needs-human, workflow::review, workflow::approved]
      anyAssignee: [swarmfoundry-bot]
      expect: { anyLabel: [workflow::review, foundry::needs-human] }

  review:
    <<: *trigger
    steps:
      - relabel: { add: [foundry::running] }
      - agent:
          <<: *agent
          agent:
            name: claude-api
            model: claude-opus-5-5
            settings: ./agents/claude/settings-readonly.json # denies pushing
          systemPrompt: ./prompts/review/system-prompt.md
          prompt: ./prompts/review/prompt.md
          timeout: 30m
      - relabel: { remove: [foundry::running] }
    concurrency: 2
    issue:
      labels: [workflow::review]
      notLabels: [foundry::failed, foundry::needs-human, workflow::ready, workflow::in-progress, workflow::approved]
      anyAssignee: [swarmfoundry-bot]
      expect: { anyLabel: [workflow::approved, workflow::ready, workflow::in-progress, foundry::needs-human] }

  merged:
    source: gitlab-local
    steps: # act on the MR's issue
      - relabel: { add: [workflow::merged], remove: [workflow::approved, workflow::review, foundry::needs-human] }
      - comment: 'Merged in !{{mergeRequest.iid}}.'
    mergeRequest: { event: merged, targetBranch: main }
